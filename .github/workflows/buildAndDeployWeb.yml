name: Build and deploy web

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: watty-web-deploy
  cancel-in-progress: true

env:
  DEPLOY_HOST: "129.121.111.69"
  DEPLOY_USER: "deploy"
  REMOTE_DIST_DIR: "/srv/watty-web/dist"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up deploy SSH key and pinned host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy dist/ to VPS
        run: |
          # No sudo needed here - /srv/watty-web is chowned to deploy by the
          # watty-server repo's own deploy workflow (see that repo's
          # buildAndDeployAPI.yml), which must run at least once before this
          # workflow's first run so the directory exists and is writable.
          #
          # Streams dist/ as a tarball over SSH (only ssh + tar needed on the
          # server). It is unpacked into a staging dir first, so a failed
          # upload never leaves the live site half-deleted; then the live
          # contents are swapped. The dist dir itself is never replaced since
          # it is bind-mounted into the Caddy container.
          tar -czf - -C dist . | ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" "
              set -euo pipefail
              DIST='$REMOTE_DIST_DIR'
              STAGE=\"\$DIST.new\"
              rm -rf \"\$STAGE\"
              mkdir -p \"\$STAGE\"
              tar -xzf - -C \"\$STAGE\"
              find \"\$DIST\" -mindepth 1 -delete
              cp -a \"\$STAGE\"/. \"\$DIST\"/
              rm -rf \"\$STAGE\"
            "

      - name: Check site is reachable
        run: |
          # Non-fatal: until watty.no's DNS is pointed at this VPS, this is
          # expected to fail and shouldn't block the deploy.
          curl -fsS --connect-timeout 5 --max-time 5 https://watty.no/ >/dev/null \
            && echo "watty.no responded" \
            || echo "watty.no not reachable yet (DNS not cut over, or cert still provisioning) - not failing the build for this"

      - name: Clean up local secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key
